[workspace]
exclude = ["transfer_circuit"]
members = ["transfer_witness", "transfer_library"]
resolver = "3"

[workspace.package]
authors = ["Heliax <hello@heliax.dev>"]
edition = "2024"
license = "GPL-3.0"
readme = "README.md"
repository = "https://github.com/anoma/anomapay-solana-resource"
version = "2.0.0-rc.2"

[workspace.dependencies]
# `default-features = false`: only the dep-free `external_call` wire types are
# used. Dropping the default `solana-program`/`anchor-lang` features keeps that
# stack out of the RISC Zero guest, which can't cross-compile it.
anoma-pa-solana-client = { git = "https://github.com/anoma/anoma-pa-solana-client", rev = "6fa81a51cf4fde3e65260a2f0c7c1cf4bc4a8287", default-features = false }
anoma-rm-risc0 = { version = "=2.0.0-rc.6", default-features = false }
anoma-rm-risc0-gadgets = "=2.0.0-rc.6"
bincode = "1.3.3"
hex-literal = "0.4"
k256 = { version = "0.13", default-features = false }
serde = { version = "1.0", features = ["derive"] }
transfer_witness = { path = "transfer_witness" }

# Always optimize; building and running the guest takes much longer without optimization.
[profile.dev]
opt-level = 3
