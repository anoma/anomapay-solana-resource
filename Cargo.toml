[workspace]
exclude = ["transfer_circuit"]
members = ["transfer_witness", "transfer_library"]
resolver = "3"

[workspace.package]
authors = ["Heliax <hello@heliax.dev>"]
edition = "2024"
license = "GPL-3.0"
readme = "README.md"
repository = "https://github.com/anoma/anomapay-solana-resource"
version = "2.0.0-rc.3"

[workspace.dependencies]
# `default-features = false`: only the dep-free `external_call` wire types are
# used. Dropping the default `solana` feature keeps the Solana SDK out of the
# RISC Zero guest, which can't cross-compile it. The rev is
# the one the forwarder client pins, so one source of this crate reaches the
# guest.
anoma-pa-solana-client = { git = "https://github.com/anoma/anoma-pa-solana-client", rev = "4c034a946d34ba09e5ce845fcae1c8880babe0cb", default-features = false }
anoma-rm-risc0 = { version = "=2.0.0-rc.6", default-features = false }
anoma-rm-risc0-gadgets = "=2.0.0-rc.6"
# `default-features = false`: only the forwarder's dep-free wire formats
# (op codes, input encoders, segment sizes, success byte, wrap message) are
# used. Dropping the default `solana` feature keeps the Solana SDK out of the
# RISC Zero guest, which can't cross-compile it.
anomapay-spl-token-forwarder-client = { git = "https://github.com/anoma/anomapay-spl-token-forwarder", rev = "54eabb1fc80b7b8accc121c91d72d898c55d855d", default-features = false }
bincode = "1.3.3"
hex-literal = "0.4"
k256 = { version = "0.13", default-features = false }
serde = { version = "1.0", features = ["derive"] }
transfer_witness = { path = "transfer_witness" }

# Always optimize; building and running the guest takes much longer without optimization.
[profile.dev]
opt-level = 3
