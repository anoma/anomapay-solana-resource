[workspace]
exclude = ["transfer_circuit"]
members = ["transfer_witness", "transfer_library"]
resolver = "3"

[workspace.package]
authors = ["Heliax <hello@heliax.dev>"]
edition = "2024"
license = "GPL-3.0"
readme = "README.md"
repository = "https://github.com/anoma/anomapay-solana-resource"
version = "2.0.0-rc.4"

[workspace.dependencies]
# anoma-pa-solana-client and anomapay-spl-token-forwarder-client (below) take
# `default-features = false`: only their dep-free wire formats are used (the
# adapter's external call; the forwarder's op codes, input encoders, segment
# sizes, success byte and wrap message), and dropping the default `solana`
# feature keeps the Solana SDK out of the RISC Zero guest, which can't
# cross-compile it. anoma-pa-solana-client's rev is the one the forwarder
# client pins, so one source of it reaches the guest.
anoma-pa-solana-client = { git = "https://github.com/anoma/anoma-pa-solana-client", rev = "8ed65a4b5f00164641c10d16661de97d47a8ecab", default-features = false }
anoma-rm-risc0 = { version = "=2.0.0-rc.6", default-features = false }
anoma-rm-risc0-gadgets = "=2.0.0-rc.6"
anomapay-spl-token-forwarder-client = { git = "https://github.com/anoma/anomapay-spl-token-forwarder", rev = "400d6b32649ba7c6d90b94050711e8fef06d2ec6", default-features = false }
bincode = "1.3.3"
hex-literal = "0.4"
k256 = { version = "0.13", default-features = false }
serde = { version = "1.0", features = ["derive"] }
transfer_witness = { path = "transfer_witness" }

# Always optimize; building and running the guest takes much longer without optimization.
[profile.dev]
opt-level = 3
