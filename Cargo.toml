[workspace]
exclude = ["transfer_circuit"]
members = ["transfer_witness", "transfer_library"]
resolver = "3"

[workspace.package]
authors = ["Heliax <hello@heliax.dev>"]
edition = "2024"
license = "GPL-3.0"
readme = "README.md"
repository = "https://github.com/anoma/anomapay-solana-resource"
version = "2.0.0"

[workspace.dependencies]
# `default-features = false`: only the dep-free `external_call` wire types are
# used. Dropping the default `solana-program`/`anchor-lang` features keeps that
# stack out of the RISC Zero guest, which can't cross-compile it.
anoma-pa-solana-client = { git = "https://github.com/anoma/anoma-pa-solana-client", rev = "9cd3752e05f615338ed56f7721bf8bab2f13525d", default-features = false }
anoma-rm-risc0 = { git = "https://github.com/anoma/arm-risc0", rev = "5085021fffd2ce25e161010c8e2d67ff62b5a7de", default-features = false }
anoma-rm-risc0-gadgets = { git = "https://github.com/anoma/arm-risc0", rev = "5085021fffd2ce25e161010c8e2d67ff62b5a7de" }
bincode = "1.3.3"
hex = "0.4"
k256 = { version = "0.13", default-features = false }
rand = "0.9.2"
serde = { version = "1.0", features = ["derive"] }
transfer_witness = { path = "transfer_witness" }

# Always optimize; building and running the guest takes much longer without optimization.
[profile.dev]
opt-level = 3
