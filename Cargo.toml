[workspace]
exclude = ["emergency_migrating_transfer_circuit", "transfer_circuit"]
members = [
  "emergency_migrating_transfer_library",
  "emergency_migrating_transfer_witness",
  "transfer_library",
  "transfer_witness",
]
resolver = "3"

[workspace.package]
authors = ["Heliax <hello@heliax.dev>"]
edition = "2024"
license = "GPL-3.0"
readme = "README.md"
repository = "https://github.com/anoma/anomapay-solana-resource"
version = "2.0.0-rc.7"

[workspace.dependencies]
# anoma-pa-solana-client and anomapay-spl-token-forwarder-client (below) take
# `default-features = false`: only their dep-free wire formats are used (the
# adapter's external call; the forwarder's op codes, input encoders, segment
# sizes and wrap message), and dropping the default `solana`
# feature keeps the Solana SDK out of the RISC Zero guest, which can't
# cross-compile it. anoma-pa-solana-client's tag is the one the forwarder
# client pins, so one source of it reaches the guest.
anoma-pa-solana-client = { git = "https://github.com/anoma/anoma-pa-solana-client", tag = "bindings/v0.7.0", default-features = false }
anoma-rm-risc0 = { version = "2.0.0-rc.7", default-features = false }
anoma-rm-risc0-gadgets = "2.0.0-rc.7"
anomapay-spl-token-forwarder-client = { git = "https://github.com/anoma/anomapay-spl-token-forwarder", rev = "ea2f185afa60ddb55383170a9000f772819f1453", default-features = false }
bincode = "1.3.3"
emergency_migrating_transfer_witness = { path = "emergency_migrating_transfer_witness" }
hex-literal = "0.4"
k256 = { version = "0.13", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_with = { version = "3", default-features = false, features = ["macros"] }
transfer_library = { path = "transfer_library" }
transfer_witness = { path = "transfer_witness" }

# Always optimize; building and running the guest takes much longer without optimization.
[profile.dev]
opt-level = 3
