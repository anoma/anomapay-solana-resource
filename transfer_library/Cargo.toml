[package]
authors.workspace = true
description = "Host-side proving API for the AnomaPay Solana token-transfer resource: witness constructors and the embedded guest ELF/ImageID."
edition.workspace = true
license.workspace = true
name = "transfer_library"
readme = "README.md"
version.workspace = true

[dependencies]
anoma-rm-risc0 = { workspace = true, features = ["transaction", "prove"] }
anoma-rm-risc0-gadgets = { workspace = true }
hex = { workspace = true }
k256 = { workspace = true, features = ["arithmetic"] }
serde = { workspace = true, features = ["derive"] }
transfer_witness = { workspace = true }

[dev-dependencies]
anoma-pa-solana-client = { workspace = true }
bincode = { workspace = true }
risc0-zkvm = "3.0.3"
