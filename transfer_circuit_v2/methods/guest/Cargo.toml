[package]
edition = "2021"
name = "token-transfer-guest-v2"
version = "1.0.0"

[workspace]

# These workspace.dependencies mirror the repository-root Cargo.toml so that
# transfer_witness/transfer_witness_v2's `{ workspace = true }` deps resolve
# correctly when the guest is compiled as a separate workspace by risc0-build.
# `anoma-pa-solana-client` is intentionally omitted: transfer_witness only uses
# its dep-free `external_call` types (`default-features = false`), so it resolves
# without pulling the solana/anchor stack into the guest.
[workspace.dependencies]
anoma-rm-risc0 = { git = "https://github.com/anoma/arm-risc0", tag = "solana-v1.2.0", default-features = false }
anoma-rm-risc0-gadgets = { git = "https://github.com/anoma/arm-risc0", tag = "solana-v1.2.0" }
bincode = "1.3.3"
k256 = { version = "=0.13.3", default-features = false }
rand = "0.9.2"
serde = { version = "1.0", features = ["derive"] }
serde_with = { version = "3.0", features = ["hex", "base64"] }

[dependencies]
risc0-zkvm = { version = "=3.0.3", features = [
  "std",
  "unstable",
], default-features = false }
transfer_witness_v2 = { path = "../../../transfer_witness_v2" }
# Pin borsh < 1.6 — borsh 1.6 makes borsh_derive a required (non-optional)
# dependency, which breaks risc0 cross-compilation for riscv32im because
# proc-macro crates cannot be compiled for guest targets.
borsh = ">=1.5, <1.6"

[patch.crates-io]
crypto-bigint = { git = "https://github.com/risc0/RustCrypto-crypto-bigint", tag = "v0.5.5-risczero.0" }
k256 = { git = "https://github.com/risc0/RustCrypto-elliptic-curves", tag = "k256/v0.13.3-risczero.1" }
