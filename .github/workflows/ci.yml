name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  vk-history:
    name: Verify each circuit's VK is documented in its VK_HISTORY.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check VK history
        run: ./scripts/check-vk-history.sh

  fmt:
    name: Format checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          components: rustfmt

      - name: cargo fmt (workspace)
        run: cargo fmt --all --check

      - name: cargo fmt (each circuit)
        run: |
          for circuit in *_circuit; do
            (cd "$circuit" && cargo fmt --all --check)
          done

      - name: Install taplo
        uses: taiki-e/install-action@v2
        with:
          tool: taplo-cli

      - name: taplo fmt
        run: taplo fmt --check

  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No Solana client in a guest lockfile
        # A client in a guest would put its release into the VK.
        run: |
          for lock in *_circuit/Cargo.lock; do
            for client in anoma-pa-solana-client anomapay-spl-token-forwarder-client; do
              count=$(awk -v name="name = \"$client\"" '$0 == name { n++ } END { print n + 0 }' "$lock")
              if [ "$count" -ne 0 ]; then
                echo "❌ $lock has $count $client packages, expected 0." >&2
                echo "   The guest declares the wire formats it commits in *_witness/src/wire.rs (transfer_library/BUILDING_THE_VK.md)." >&2
                exit 1
              fi
            done
          done
          echo "✅ no guest lockfile has a Solana client"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .

      - name: cargo build (workspace)
        run: cargo build --workspace --all-targets

      - name: cargo test (workspace)
        run: cargo test --workspace -- --nocapture
        env:
          RISC0_DEV_MODE: "1"

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .

      - name: cargo clippy (workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings

  circuits:
    name: List the circuits
    runs-on: ubuntu-latest
    outputs:
      circuits: ${{ steps.list.outputs.circuits }}
    steps:
      - uses: actions/checkout@v4

      - id: list
        run: echo "circuits=$(ls -d *_circuit | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  guest-reproducibility:
    name: Rebuild ${{ matrix.circuit }} and check its VK
    needs: circuits
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        circuit: ${{ fromJSON(needs.circuits.outputs.circuits) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-risczero
        # rzup resolves release assets through the GitHub API; the workflow
        # token keeps it under the authenticated rate limit.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L https://risczero.com/install | bash
          "$HOME/.risc0/bin/rzup" install cargo-risczero 3.0.5
          # cargo risczero build checks for a local RISC Zero Rust toolchain
          # before it starts the Docker builder; 1.88.0 is the builder's own.
          "$HOME/.risc0/bin/rzup" install rust 1.88.0
          echo "$HOME/.risc0/bin" >> "$GITHUB_PATH"

      - name: Build the guest in the reproducible builder
        run: cargo risczero build --manifest-path ${{ matrix.circuit }}/Cargo.toml

      - name: Compare with the embedded guest
        # A circuit `<x>_circuit` builds the guest its package names, which
        # the library `<x>_library` embeds.
        env:
          CIRCUIT: ${{ matrix.circuit }}
        run: |
          guest=$(sed -n 's/^name = "\(.*\)"$/\1/p' "$CIRCUIT/Cargo.toml")
          built=$CIRCUIT/target/riscv32im-risc0-zkvm-elf/docker/$guest.bin
          embedded=${CIRCUIT%_circuit}_library/elf/$guest.bin
          if ! cmp "$built" "$embedded"; then
            echo "❌ The guest built from source differs from $embedded." >&2
            echo "   Rebuild with cargo risczero build, embed the ELF, set the library's VK, record the rotation in its VK_HISTORY.md." >&2
            exit 1
          fi
          echo "✅ the embedded guest reproduces from source"
